services:
  api:
    build: .
    container_name: travel-guide-api
    restart: always

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - '3000:3000'

  redis:
    image: redis:7-alpine
    container_name: travel-guide-redis
    restart: always

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - redis-data:/data

volumes:
  redis-data:
